<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Séries podcast | L'Évangile du Royaume</title>
  <meta name="description" content="24 enseignements classiques de L'Évangile du Royaume — écoutez directement en ligne.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" href="assets/images/favicon.png" sizes="32x32">
  <link rel="stylesheet" href="assets/css/style.css?v=nav-labels-1">
  <style>

    /* ══════════════════════════════════════════════════════
       PAGE MÉDIAS — styles communs
    ══════════════════════════════════════════════════════ */
    .media-hero {
      background: linear-gradient(160deg, var(--brand-blue-dk) 0%, #162854 55%, var(--brand-blue) 100%);
      padding: 7rem 0 3rem;
    }
    .media-hero-inner {
      display: flex; align-items: center;
      justify-content: space-between; gap: 2rem; flex-wrap: wrap;
    }
    .media-hero-eyebrow {
      font-size: .7rem; font-weight: 800; letter-spacing: .14em;
      text-transform: uppercase; color: var(--gold-light); margin-bottom: .6rem;
    }
    .media-hero-title {
      font-family: var(--font-serif); font-size: clamp(2rem,4vw,3rem);
      font-weight: 700; color: #fff; line-height: 1.1; margin-bottom: .65rem;
    }
    .media-hero-sub { font-size: .93rem; color: rgba(255,255,255,.55); max-width: 420px; line-height: 1.6; }
    .type-tabs { background: rgba(0,0,0,.25); border-top: 1px solid rgba(255,255,255,.1); }
    .type-tabs-inner { display: flex; gap: 0; }
    .type-tab {
      display: flex; align-items: center; gap: .5rem;
      padding: .95rem 1.5rem; font-size: .83rem; font-weight: 700;
      color: rgba(255,255,255,.5); text-decoration: none;
      border-bottom: 3px solid transparent; transition: color .2s, border-color .2s; white-space: nowrap;
    }
    .type-tab:hover { color: rgba(255,255,255,.85); }
    .type-tab.active { color: #fff; border-bottom-color: var(--gold-light); }
    .type-tab svg { opacity: .7; }
    .type-tab.active svg { opacity: 1; }

    /* ── Page body ──────────────────────────────────────── */
    .media-body { background: var(--ivory); padding: 2.5rem 0 6rem; }

    /* ══════════════════════════════════════════════════════
       AUDIO SERIES SECTIONS
    ══════════════════════════════════════════════════════ */
    .audio-section { margin-bottom: 2.5rem; }

    .audio-section-hd {
      display: flex; align-items: center; gap: .75rem;
      margin-bottom: .5rem; padding-bottom: .65rem;
      border-bottom: 2px solid var(--ivory-dark);
    }
    .audio-hd-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--brand-blue);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #fff;
    }
    .audio-hd-name {
      font-family: var(--font-serif); font-size: 1.05rem;
      font-weight: 700; color: var(--charcoal);
    }
    .audio-hd-count {
      font-size: .7rem; font-weight: 700; color: var(--warm-grey);
      background: var(--ivory-dark); padding: .18rem .55rem;
      border-radius: 99px; flex-shrink: 0;
    }

    /* ══════════════════════════════════════════════════════
       AUDIO TRACK ROW
    ══════════════════════════════════════════════════════ */
    .audio-list { display: flex; flex-direction: column; }

    .audio-row {
      display: grid;
      grid-template-columns: 44px 28px 1fr auto auto;
      align-items: center;
      gap: 1rem;
      padding: .7rem 1rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background .15s;
      position: relative;
    }
    .audio-row:hover { background: rgba(30,79,163,.06); }
    .audio-row.playing {
      background: rgba(30,79,163,.09);
    }
    .audio-row.playing .ar-num { display: none; }
    .audio-row.playing .ar-playing-bars { display: flex; }

    /* Play button */
    .ar-play-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--brand-blue);
      display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
      opacity: 0;
      transition: opacity .15s, transform .15s, background .15s;
    }
    .audio-row:hover .ar-play-btn,
    .audio-row.playing .ar-play-btn { opacity: 1; }
    .audio-row.playing .ar-play-btn { background: var(--gold); }
    .ar-play-btn:hover { transform: scale(1.08); }

    /* Track number */
    .ar-num {
      font-size: .8rem; font-weight: 700; color: var(--warm-grey);
      text-align: center; user-select: none;
    }
    /* Animated bars (playing indicator) */
    .ar-playing-bars {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      justify-content: center;
    }
    .ar-playing-bars span {
      display: block; width: 3px; background: var(--gold);
      border-radius: 2px; animation: bars .9s ease-in-out infinite alternate;
    }
    .ar-playing-bars span:nth-child(1) { height: 100%; animation-delay: 0s; }
    .ar-playing-bars span:nth-child(2) { height: 60%; animation-delay: .15s; }
    .ar-playing-bars span:nth-child(3) { height: 80%; animation-delay: .3s; }
    .ar-playing-bars span:nth-child(4) { height: 45%; animation-delay: .45s; }
    @keyframes bars {
      from { transform: scaleY(.4); }
      to   { transform: scaleY(1); }
    }

    /* Track info */
    .ar-info { min-width: 0; }
    .ar-title {
      font-size: .9rem; font-weight: 600; color: var(--charcoal);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: .1rem;
    }
    .audio-row.playing .ar-title { color: var(--brand-blue); }
    .ar-series {
      font-size: .7rem; font-weight: 600; color: var(--warm-grey);
      background: var(--ivory-dark); padding: .1rem .45rem;
      border-radius: 99px; display: inline-block;
    }

    /* Duration */
    .ar-dur {
      font-size: .75rem; font-weight: 600; color: var(--warm-grey);
      white-space: nowrap; flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* Download link */
    .ar-dl {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--warm-grey); opacity: 0; transition: opacity .15s, background .15s;
      text-decoration: none; flex-shrink: 0;
    }
    .audio-row:hover .ar-dl { opacity: 1; }
    .ar-dl:hover { background: var(--ivory-dark); color: var(--brand-blue); }

    /* ══════════════════════════════════════════════════════
       STICKY PLAYER BAR
    ══════════════════════════════════════════════════════ */
    .player-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 76px;
      background: #0c1931;
      border-top: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center;
      padding: 0 1.5rem; gap: 1.25rem;
      z-index: 999;
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
    }
    .player-bar.visible { transform: translateY(0); }

    .pb-track {
      display: flex; align-items: center; gap: .85rem;
      flex: 0 0 280px; min-width: 0;
    }
    .pb-icon {
      width: 46px; height: 46px; border-radius: 8px;
      background: linear-gradient(135deg, var(--brand-blue-dk), var(--brand-blue));
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--gold-light);
    }
    .pb-info { min-width: 0; }
    .pb-title {
      font-size: .82rem; font-weight: 700; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 200px;
    }
    .pb-series { font-size: .68rem; color: rgba(255,255,255,.45); margin-top: .1rem; }
    .pb-status { font-size: .65rem; margin-top: .15rem; display: none; }
    .pb-status.is-error   { color: #ff8a80; display: block; }
    .pb-status.is-loading { color: rgba(255,255,255,.5); display: block; }
    .pb-status a { color: inherit; text-decoration: underline; }

    .pb-controls {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: .45rem;
    }
    .pb-btns { display: flex; align-items: center; gap: .85rem; }
    .pb-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.65); padding: .3rem;
      border-radius: 50%; transition: color .15s, background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .pb-btn:hover { color: #fff; background: rgba(255,255,255,.08); }
    .pb-btn-main {
      width: 40px; height: 40px; border-radius: 50%;
      background: #fff; color: var(--brand-blue-dk);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s, background .15s; flex-shrink: 0;
    }
    .pb-btn-main:hover { transform: scale(1.06); background: var(--ivory); }

    .pb-progress {
      display: flex; align-items: center; gap: .75rem;
      width: 100%; max-width: 500px;
    }
    .pb-time { font-size: .68rem; color: rgba(255,255,255,.4); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .pb-bar-wrap {
      flex: 1; height: 4px; background: rgba(255,255,255,.15);
      border-radius: 2px; cursor: pointer; position: relative;
    }
    .pb-bar-fill {
      height: 100%; background: #fff; border-radius: 2px;
      width: 0%; transition: width .2s linear;
    }
    .pb-bar-wrap:hover .pb-bar-fill { background: var(--gold-light); }

    .pb-vol {
      display: flex; align-items: center; gap: .5rem; flex: 0 0 130px;
    }
    .pb-vol-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.55); padding: .25rem;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s;
    }
    .pb-vol-btn:hover { color: #fff; }
    .pb-vol-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 4px; background: rgba(255,255,255,.2);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    .pb-vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #fff; cursor: pointer;
    }

    .pb-close {
      flex-shrink: 0;
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.35);
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, background .15s; margin-left: .25rem;
    }
    .pb-close:hover { color: #fff; background: rgba(255,255,255,.1); }

    /* ── YouTube CTA ─────────────────────────────────── */
    .yt-cta {
      margin-top: 3rem;
      background: linear-gradient(135deg, #0d0d0d 0%, #1c1c1c 100%);
      border-radius: var(--radius-lg); padding: 2rem 1.75rem;
      display: flex; align-items: center;
      justify-content: space-between; gap: 1.5rem; flex-wrap: wrap;
    }
    .yt-cta-left { display: flex; align-items: center; gap: 1rem; }
    .yt-cta-icon {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--brand-blue);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .yt-cta strong { display: block; font-family: var(--font-serif); font-size: 1.1rem; color: #fff; margin-bottom: .2rem; }
    .yt-cta span { font-size: .78rem; color: rgba(255,255,255,.45); }
    .btn-primary {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--brand-blue); color: #fff;
      padding: .75rem 1.5rem; border-radius: 99px;
      font-size: .86rem; font-weight: 700; text-decoration: none;
      transition: background .2s, transform .15s; white-space: nowrap;
    }
    .btn-primary:hover { background: var(--brand-blue-dk); transform: scale(1.04); }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 768px) {
      .audio-row { grid-template-columns: 44px 1fr auto auto; }
      .audio-row > div:not(.ar-info) { display: none; }
      .audio-row .ar-play-btn { opacity: 1; }
      .pb-track { flex: 0 0 auto; max-width: 140px; }
      .pb-vol { display: none; }
      .pb-title { max-width: 120px; }
    }
    @media (max-width: 480px) {
      .pb-btn.pb-skip { display: none; }
      .media-hero-inner { flex-direction: column; align-items: flex-start; }
    }

  </style>

<script>
(function () {
  const audio      = document.getElementById('audioEl');
  const playerBar  = document.getElementById('playerBar');
  const pbTitle    = document.getElementById('pbTitle');
  const pbSeries   = document.getElementById('pbSeries');
  const btnPP      = document.getElementById('btnPlayPause');
  const ppIcon     = document.getElementById('ppIcon');
  const btnPrev    = document.getElementById('btnPrev');
  const btnNext    = document.getElementById('btnNext');
  const pbBarWrap  = document.getElementById('pbBarWrap');
  const pbBarFill  = document.getElementById('pbBarFill');
  const pbCurrent  = document.getElementById('pbCurrent');
  const pbDuration = document.getElementById('pbDuration');
  const volSlider  = document.getElementById('volSlider');
  const btnMute    = document.getElementById('btnMute');
  const btnClose   = document.getElementById('btnClose');
  const pbStatus   = document.getElementById('pbStatus');

  let allRows      = [];
  let currentIdx   = -1;
  let stallRetryId = null;

  function setStatus(type, html) {
    pbStatus.className = 'pb-status' + (type ? ' is-' + type : '');
    pbStatus.innerHTML = html || '';
  }
  function clearStatus() { setStatus('', ''); }
  function downloadLink(idx) { return allRows[idx]?.querySelector('.ar-dl'); }
  function showAudioError() {
    const dl = downloadLink(currentIdx);
    const dlHtml = dl
      ? ' — <a href="' + dl.href + '" target="_blank" rel="noopener noreferrer">Télécharger</a>'
      : '';
    setStatus('error', '⚠️ Fichier indisponible' + dlHtml);
    setPlayingRow(-1);
  }

  function fmt(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function buildPlaylist() {
    allRows = Array.from(document.querySelectorAll('.audio-row'));
  }

  function setRowDuration(row, seconds) {
    if (!row || !seconds || isNaN(seconds)) return;
    const durEl = row.querySelector('.ar-dur');
    if (durEl) durEl.textContent = fmt(seconds);
  }

  function probeDuration(row) {
    return new Promise((resolve) => {
      const src = row?.dataset?.src || '';
      if (!src) return resolve();
      const durEl = row.querySelector('.ar-dur');
      if (durEl && durEl.textContent !== '—') return resolve();
      const probe = new Audio();
      let settled = false;
      const cleanup = () => {
        probe.removeAttribute('src');
        probe.load();
      };
      const finish = (seconds) => {
        if (settled) return;
        settled = true;
        if (seconds && !isNaN(seconds)) setRowDuration(row, seconds);
        cleanup();
        resolve();
      };

      probe.preload = 'metadata';
      probe.addEventListener('loadedmetadata', () => finish(probe.duration), { once: true });
      probe.addEventListener('error', () => finish(null), { once: true });
      probe.src = src;
    });
  }

  async function preloadDurations() {
    for (const row of allRows) {
      await probeDuration(row);
    }
  }

  function setPlayingRow(idx) {
    allRows.forEach((r, i) => r.classList.toggle('playing', i === idx));
    allRows.forEach((r, i) => {
      const btn = r.querySelector('.ar-play-btn use');
      if (btn) btn.setAttribute('href', i === idx && !audio.paused ? '#icon-pause' : '#icon-play');
    });
  }

  function loadTrack(idx) {
    if (idx < 0 || idx >= allRows.length) return;
    clearStatus();
    clearTimeout(stallRetryId);
    currentIdx = idx;
    const row    = allRows[idx];
    const src    = row.dataset.src || '';
    if (!src) return;
    const title  = row.dataset.title || row.querySelector('.ar-title')?.textContent || '—';
    const series = row.dataset.series || '—';

    pbTitle.textContent  = title;
    pbSeries.textContent = series;
    playerBar.classList.add('visible');
    setPlayingRow(idx);

    audio.src = src;
    audio.load();
    setStatus('loading', 'Chargement…');
    audio.play()
      .then(clearStatus)
      .catch(err => {
        if (err.name === 'NotAllowedError') {
          clearStatus();
        } else {
          showAudioError();
        }
      });
  }

  function togglePlay() {
    if (audio.paused) audio.play();
    else audio.pause();
  }

  function initRows() {
    allRows.forEach((row, idx) => {
      const btn = row.querySelector('.ar-play-btn');
      if (btn) {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (idx === currentIdx) { togglePlay(); return; }
          loadTrack(idx);
        });
      }
      row.addEventListener('click', (e) => {
        if (e.target.closest('.ar-dl') || e.target.closest('.ar-play-btn')) return;
        if (idx === currentIdx) { togglePlay(); return; }
        loadTrack(idx);
      });
    });
  }

  btnPP.addEventListener('click', () => {
    if (currentIdx === -1 && allRows.length) { loadTrack(0); return; }
    togglePlay();
  });
  btnNext.addEventListener('click', () => loadTrack((currentIdx + 1) % allRows.length));
  btnPrev.addEventListener('click', () => {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    loadTrack((currentIdx - 1 + allRows.length) % allRows.length);
  });

  audio.addEventListener('play',  () => {
    clearStatus();
    ppIcon.setAttribute('href', '#icon-pause');
    setPlayingRow(currentIdx);
    const btn = allRows[currentIdx]?.querySelector('.ar-play-btn use');
    if (btn) btn.setAttribute('href', '#icon-pause');
  });
  audio.addEventListener('pause', () => {
    ppIcon.setAttribute('href', '#icon-play');
    const btn = allRows[currentIdx]?.querySelector('.ar-play-btn use');
    if (btn) btn.setAttribute('href', '#icon-play');
  });
  audio.addEventListener('ended', () => {
    clearStatus();
    loadTrack((currentIdx + 1) % allRows.length);
  });
  audio.addEventListener('error',   () => showAudioError());
  audio.addEventListener('canplay', clearStatus);
  audio.addEventListener('waiting', () => setStatus('loading', 'Chargement…'));
  audio.addEventListener('stalled', () => {
    setStatus('loading', 'Connexion lente…');
    if (stallRetryId) clearTimeout(stallRetryId);
    stallRetryId = setTimeout(() => {
      if (audio.readyState < 3) {
        audio.load();
        audio.play().catch(() => showAudioError());
      }
    }, 8000);
  });
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    pbBarFill.style.width  = (audio.currentTime / audio.duration * 100) + '%';
    pbCurrent.textContent  = fmt(audio.currentTime);
    pbDuration.textContent = fmt(audio.duration);
    setRowDuration(allRows[currentIdx], audio.duration);
  });
  audio.addEventListener('loadedmetadata', () => {
    pbDuration.textContent = fmt(audio.duration);
    setRowDuration(allRows[currentIdx], audio.duration);
  });

  pbBarWrap.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = pbBarWrap.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  volSlider.addEventListener('input', () => { audio.volume = volSlider.value; });
  btnMute.addEventListener('click',   () => {
    audio.muted    = !audio.muted;
    volSlider.value = audio.muted ? 0 : audio.volume;
  });

  /* Close player bar */
  btnClose.addEventListener('click', () => {
    clearTimeout(stallRetryId);
    clearStatus();
    audio.pause(); audio.src = '';
    playerBar.classList.remove('visible');
    allRows.forEach(r => {
      r.classList.remove('playing');
      const btn = r.querySelector('.ar-play-btn use');
      if (btn) btn.setAttribute('href', '#icon-play');
    });
    currentIdx = -1;
  });

  /* ── Renderer : construit les sections depuis les données JSON ── */
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderAudioSections(tracks) {
    const order = [];
    const groups = {};
    for (const t of tracks) {
      if (!groups[t.sectionName]) { groups[t.sectionName] = []; order.push(t.sectionName); }
      groups[t.sectionName].push(t);
    }
    const container = document.getElementById('audio-sections-container');
    container.innerHTML = order.map(name => {
      const rows = groups[name];
      const count = rows.length;
      return `<section class="audio-section">
        <div class="audio-section-hd">
          <div class="audio-hd-icon"><svg width="14" height="14"><use href="#icon-mic"/></svg></div>
          <span class="audio-hd-name">${escapeHtml(name)}</span>
          <span class="audio-hd-count">${count} ${count > 1 ? 'épisodes' : 'épisode'}</span>
        </div>
        <div class="audio-list">
          ${rows.map((t, i) => `
          <div class="audio-row"
               data-src="${escapeHtml(t.src)}"
               data-title="${escapeHtml(t.title)}"
               data-series="${escapeHtml(t.series)}">
            <button class="ar-play-btn" aria-label="Lire"><svg width="14" height="14"><use href="#icon-play"/></svg></button>
            <div><span class="ar-num">${String(i + 1).padStart(2, '0')}</span><span class="ar-playing-bars"><span></span><span></span><span></span><span></span></span></div>
            <div class="ar-info"><div class="ar-title">${escapeHtml(t.title)}</div><span class="ar-series">${escapeHtml(t.series)}</span></div>
            <span class="ar-dur">—</span>
            <a href="${escapeHtml(t.src)}" target="_blank" rel="noopener noreferrer" class="ar-dl" aria-label="Télécharger"><svg width="15" height="15"><use href="#icon-download"/></svg></a>
          </div>`).join('')}
        </div>
      </section>`;
    }).join('');
  }

  /* ── Init : chargement depuis JSON ── */
  fetch('assets/data/podcasts.json')
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(tracks) {
      renderAudioSections(tracks);
      buildPlaylist();
      initRows();
      preloadDurations();
    })
    .catch(function(e) {
      document.getElementById('audio-sections-container').innerHTML =
        '<p style="padding:2rem;color:rgba(255,255,255,.5)">Impossible de charger les podcasts. Veuillez réessayer.</p>';
      console.error('podcasts.json load error:', e);
    });

})();
</script>
</body>
</html>
