<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages audio | L'Évangile du Royaume</title>
  <meta name="description" content="Tous les messages audio de L'Évangile du Royaume — enseignements, séries et sessions à écouter en ligne.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" href="assets/images/favicon.png" sizes="32x32">
  <link rel="stylesheet" href="assets/css/style.css?v=nav-labels-1">
  <link rel="stylesheet" href="assets/css/pages/audios.css">
  <meta property="og:image" content="https://images.unsplash.com/photo-1529655683826-aba9b3e77383?w=1200&q=80&auto=format&fit=crop">
</head>
<body data-page="audios">
<script src="assets/js/nav.js"></script>

<!-- ══ HEADER ═══════════════════════════════════════════════ -->
<!-- ══ HERO ═══════════════════════════════════════════════ -->
<div class="media-hero">
  <div class="container">
    <div class="media-hero-inner">
      <div>
        <p class="media-hero-eyebrow">Médias · L'Évangile du Royaume</p>
        <h1 class="media-hero-title">Messages audio</h1>
        <p class="media-hero-sub">Tous les enseignements audio — écoutez directement ou téléchargez.</p>
      </div>
    </div>
  </div>

  <!-- Type tabs -->
  <div class="type-tabs" role="navigation" aria-label="Type de contenu">
    <div class="container">
      <div class="type-tabs-inner">
        <a href="radio.html"    class="type-tab">
          <svg width="15" height="15" aria-hidden="true"><use href="#icon-radio"/></svg>
          Radio en direct
        </a>
        <a href="audios.html"   class="type-tab active">
          <svg width="15" height="15" aria-hidden="true"><use href="#icon-headphones"/></svg>
          Messages audio
        </a>
        <a href="podcasts.html" class="type-tab">
          <svg width="15" height="15" aria-hidden="true"><use href="#icon-mic"/></svg>
          Séries podcast
        </a>
      </div>
    </div>
  </div>
</div>

<!-- ══ MAIN ═══════════════════════════════════════════════ -->
<main class="media-body" id="main-content">
  <div class="container">

    <div id="audio-sections-container" aria-live="polite" aria-label="Séries audio">
      <!-- Chargé dynamiquement depuis assets/data/audios.json -->
    </div>

    <!-- CTA -->
    <div class="yt-cta">
      <div class="yt-cta-left">
        <div class="yt-cta-icon" aria-hidden="true"><svg width="22" height="22" style="color:#fff"><use href="#icon-headphones"/></svg></div>
        <div>
          <strong>50 messages audio</strong>
          <span>50 enseignements — cliquez pour écouter directement</span>
        </div>
      </div>
      <a href="https://levangileduroyaume.com/category/medias/audios/" target="_blank" rel="noopener noreferrer" class="btn-primary">
        <svg width="15" height="15" aria-hidden="true"><use href="#icon-arrow-right"/></svg>
        Site d'origine
      </a>
    </div>

  </div>
</main>

<!-- ══ STICKY PLAYER BAR ══════════════════════════════════ -->
<div class="player-bar" id="playerBar" role="region" aria-label="Lecteur audio">
  <audio id="audioEl" preload="none"></audio>

  <!-- Track info -->
  <div class="pb-track">
    <div class="pb-icon">
      <svg width="22" height="22"><use href="#icon-headphones"/></svg>
    </div>
    <div class="pb-info">
      <div class="pb-title" id="pbTitle">—</div>
      <div class="pb-series" id="pbSeries">—</div>
      <div class="pb-status" id="pbStatus" role="alert" aria-live="polite"></div>
    </div>
  </div>

  <!-- Controls (HTML5 mode) -->
  <div class="pb-controls">
    <div class="pb-btns">
      <button class="pb-btn pb-skip" id="btnPrev" aria-label="Précédent">
        <svg width="20" height="20"><use href="#icon-skip-prev"/></svg>
      </button>
      <button class="pb-btn-main" id="btnPlayPause" aria-label="Lecture / Pause">
        <svg width="18" height="18" id="ppIcon"><use href="#icon-play"/></svg>
      </button>
      <button class="pb-btn pb-skip" id="btnNext" aria-label="Suivant">
        <svg width="20" height="20"><use href="#icon-skip-next"/></svg>
      </button>
    </div>
    <div class="pb-progress">
      <span class="pb-time" id="pbCurrent">0:00</span>
      <div class="pb-bar-wrap" id="pbBarWrap">
        <div class="pb-bar-fill" id="pbBarFill"></div>
      </div>
      <span class="pb-time" id="pbDuration">0:00</span>
    </div>
  </div>

  <!-- Volume -->
  <div class="pb-vol">
    <button class="pb-vol-btn" id="btnMute" aria-label="Muet">
      <svg width="16" height="16"><use href="#icon-volume"/></svg>
    </button>
    <input type="range" class="pb-vol-slider" id="volSlider" min="0" max="1" step="0.02" value="1" aria-label="Volume">
  </div>

  <!-- Close -->
  <button class="pb-close" id="btnClose" aria-label="Fermer le lecteur">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/media-player.js"></script>
<script src="assets/js/main.js" defer></script>
<script>
EduRoyaume.MediaPlayer.init({
  dataUrl       : 'assets/data/audios.json',
  icon          : '#icon-headphones',
  labelSingular : 'partie',
  labelPlural   : 'parties',
});
</script>

</body>
</html>
