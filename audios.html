<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages audio | L'Évangile du Royaume</title>
  <meta name="description" content="Tous les messages audio de L'Évangile du Royaume — enseignements, séries et sessions à écouter en ligne.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" href="assets/images/favicon.png" sizes="32x32">
  <link rel="stylesheet" href="assets/css/style.css?v=nav-labels-1">
  <link rel="stylesheet" href="assets/css/pages/audios.css">
  <meta property="og:image" content="https://images.unsplash.com/photo-1529655683826-aba9b3e77383?w=1200&q=80&auto=format&fit=crop">
</head>
<body data-page="audios">
<script src="assets/js/nav.js"></script>

<!-- ══ HEADER ═══════════════════════════════════════════════ -->
<!-- ══ HERO ═══════════════════════════════════════════════ -->
<div class="media-hero">
  <div class="container">
    <div class="media-hero-inner">
      <div>
        <p class="media-hero-eyebrow">Médias · L'Évangile du Royaume</p>
        <h1 class="media-hero-title">Messages audio</h1>
        <p class="media-hero-sub">Tous les enseignements audio — écoutez directement ou téléchargez.</p>
      </div>
    </div>
  </div>

  <!-- Type tabs -->
  <div class="type-tabs" role="navigation" aria-label="Type de contenu">
    <div class="container">
      <div class="type-tabs-inner">
        <a href="radio.html"    class="type-tab">
          <svg width="15" height="15" aria-hidden="true"><use href="#icon-radio"/></svg>
          Radio en direct
        </a>
        <a href="audios.html"   class="type-tab active">
          <svg width="15" height="15" aria-hidden="true"><use href="#icon-headphones"/></svg>
          Messages audio
        </a>
        <a href="podcasts.html" class="type-tab">
          <svg width="15" height="15" aria-hidden="true"><use href="#icon-mic"/></svg>
          Séries podcast
        </a>
      </div>
    </div>
  </div>
</div>

<!-- ══ MAIN ═══════════════════════════════════════════════ -->
<main class="media-body" id="main-content">
  <div class="container">

    <div id="audio-sections-container" aria-live="polite" aria-label="Séries audio">
      <!-- Chargé dynamiquement depuis assets/data/audios.json -->
    </div>

    <!-- CTA -->
    <div class="yt-cta">
      <div class="yt-cta-left">
        <div class="yt-cta-icon" aria-hidden="true"><svg width="22" height="22" style="color:#fff"><use href="#icon-headphones"/></svg></div>
        <div>
          <strong>50 messages audio</strong>
          <span>50 enseignements — cliquez pour écouter directement</span>
        </div>
      </div>
      <a href="https://levangileduroyaume.com/category/medias/audios/" target="_blank" rel="noopener" class="btn-primary">
        <svg width="15" height="15" aria-hidden="true"><use href="#icon-arrow-r"/></svg>
        Site d'origine
      </a>
    </div>

  </div>
</main>

<!-- ══ STICKY PLAYER BAR ══════════════════════════════════ -->
<div class="player-bar" id="playerBar" role="region" aria-label="Lecteur audio">
  <audio id="audioEl" preload="none"></audio>

  <!-- Track info -->
  <div class="pb-track">
    <div class="pb-icon">
      <svg width="22" height="22"><use href="#icon-headphones"/></svg>
    </div>
    <div class="pb-info">
      <div class="pb-title" id="pbTitle">—</div>
      <div class="pb-series" id="pbSeries">—</div>
      <div class="pb-status" id="pbStatus" role="alert" aria-live="polite"></div>
    </div>
  </div>

  <!-- Controls (HTML5 mode) -->
  <div class="pb-controls">
    <div class="pb-btns">
      <button class="pb-btn pb-skip" id="btnPrev" aria-label="Précédent">
        <svg width="20" height="20"><use href="#icon-skip-prev"/></svg>
      </button>
      <button class="pb-btn-main" id="btnPlayPause" aria-label="Lecture / Pause">
        <svg width="18" height="18" id="ppIcon"><use href="#icon-play"/></svg>
      </button>
      <button class="pb-btn pb-skip" id="btnNext" aria-label="Suivant">
        <svg width="20" height="20"><use href="#icon-skip-next"/></svg>
      </button>
    </div>
    <div class="pb-progress">
      <span class="pb-time" id="pbCurrent">0:00</span>
      <div class="pb-bar-wrap" id="pbBarWrap">
        <div class="pb-bar-fill" id="pbBarFill"></div>
      </div>
      <span class="pb-time" id="pbDuration">0:00</span>
    </div>
  </div>

  <!-- Volume -->
  <div class="pb-vol">
    <button class="pb-vol-btn" id="btnMute" aria-label="Muet">
      <svg width="16" height="16"><use href="#icon-volume"/></svg>
    </button>
    <input type="range" class="pb-vol-slider" id="volSlider" min="0" max="1" step="0.02" value="1" aria-label="Volume">
  </div>

  <!-- Close -->
  <button class="pb-close" id="btnClose" aria-label="Fermer le lecteur">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>

<script src="assets/js/main.js" defer></script>

<script>
(function () {
  const audio      = document.getElementById('audioEl');
  const playerBar  = document.getElementById('playerBar');
  const pbTitle    = document.getElementById('pbTitle');
  const pbSeries   = document.getElementById('pbSeries');
  const btnPP      = document.getElementById('btnPlayPause');
  const ppIcon     = document.getElementById('ppIcon');
  const btnPrev    = document.getElementById('btnPrev');
  const btnNext    = document.getElementById('btnNext');
  const pbBarWrap  = document.getElementById('pbBarWrap');
  const pbBarFill  = document.getElementById('pbBarFill');
  const pbCurrent  = document.getElementById('pbCurrent');
  const pbDuration = document.getElementById('pbDuration');
  const volSlider  = document.getElementById('volSlider');
  const btnMute    = document.getElementById('btnMute');
  const btnClose   = document.getElementById('btnClose');

  let allRows = [];
  let currentIdx = -1;
  let wasPaused  = false;

  function fmt(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function buildPlaylist() {
    allRows = Array.from(document.querySelectorAll('.audio-row'));
  }

  function setRowDuration(row, seconds) {
    if (!row || !seconds || isNaN(seconds)) return;
    const durEl = row.querySelector('.ar-dur');
    if (durEl) durEl.textContent = fmt(seconds);
  }

  function probeDuration(row) {
    return new Promise((resolve) => {
      const src = row?.dataset?.src || '';
      if (!src) return resolve();
      const durEl = row.querySelector('.ar-dur');
      if (durEl && durEl.textContent !== '—') return resolve();
      const probe = new Audio();
      let settled = false;
      const cleanup = () => {
        probe.removeAttribute('src');
        probe.load();
      };
      const finish = (seconds) => {
        if (settled) return;
        settled = true;
        if (seconds && !isNaN(seconds)) setRowDuration(row, seconds);
        cleanup();
        resolve();
      };

      probe.preload = 'metadata';
      probe.addEventListener('loadedmetadata', () => finish(probe.duration), { once: true });
      probe.addEventListener('error', () => finish(null), { once: true });
      probe.src = src;
    });
  }

  async function preloadDurations() {
    for (const row of allRows) {
      await probeDuration(row);
    }
  }

  function setPlayingRow(idx) {
    allRows.forEach((r, i) => r.classList.toggle('playing', i === idx));
    // update play button icon inside each row
    allRows.forEach((r, i) => {
      const btn = r.querySelector('.ar-play-btn use');
      if (btn) btn.setAttribute('href', i === idx && !audio.paused ? '#icon-pause' : '#icon-play');
    });
  }

  /* ── Helpers ──────────────────────────────────────── */
  const pbStatus   = document.getElementById('pbStatus');

  let stallRetryId = null;

  /* Récupère le lien de téléchargement de la piste courante */
  function downloadLink(idx) {
    if (idx < 0 || idx >= allRows.length) return null;
    return allRows[idx].querySelector('.ar-dl');
  }

  /* Affiche un message d'état dans la barre player */
  function setStatus(type, html) {
    if (!pbStatus) return;
    pbStatus.className = 'pb-status' + (type ? ' is-' + type : '');
    pbStatus.innerHTML = html || '';
  }

  function clearStatus() { setStatus('', ''); }

  /* Affiche l'état d'erreur avec lien de téléchargement */
  function showAudioError() {
    const dl = downloadLink(currentIdx);
    const dlHtml = dl
      ? ' — <a href="' + dl.href + '" target="_blank" rel="noopener noreferrer">Télécharger</a>'
      : '';
    setStatus('error', '⚠️ Fichier indisponible' + dlHtml);
    /* Réinitialise l'icône de la rangée */
    setPlayingRow(-1);
  }

  function loadTrack(idx) {
    if (idx < 0 || idx >= allRows.length) return;
    clearStatus();
    clearTimeout(stallRetryId);
    currentIdx = idx;
    const row    = allRows[idx];
    const src    = row.dataset.src || '';
    if (!src) return;
    const title  = row.dataset.title || row.querySelector('.ar-title')?.textContent || '—';
    const series = row.dataset.series || '—';

    pbTitle.textContent  = title;
    pbSeries.textContent = series;
    playerBar.classList.add('visible');
    setPlayingRow(idx);

    audio.src = src;
    audio.load();
    setStatus('loading', 'Chargement…');
    audio.play()
      .then(function() { clearStatus(); })
      .catch(function(err) {
        if (err.name === 'NotAllowedError') {
          clearStatus();
        } else {
          showAudioError();
        }
      });
  }

  function togglePlay() {
    if (audio.paused) audio.play();
    else audio.pause();
  }

  /* Row click → play */
  function initRows() {
    allRows.forEach((row, idx) => {
      const btn = row.querySelector('.ar-play-btn');
      if (btn) {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (idx === currentIdx) { togglePlay(); return; }
          loadTrack(idx);
        });
      }
      row.addEventListener('click', (e) => {
        if (e.target.closest('.ar-dl') || e.target.closest('.ar-play-btn')) return;
        if (idx === currentIdx) { togglePlay(); return; }
        loadTrack(idx);
      });
    });
  }

  /* Player controls */
  btnPP.addEventListener('click', () => {
    if (currentIdx === -1 && allRows.length) { loadTrack(0); return; }
    togglePlay();
  });
  btnNext.addEventListener('click', () => loadTrack((currentIdx + 1) % allRows.length));
  btnPrev.addEventListener('click', () => {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    loadTrack((currentIdx - 1 + allRows.length) % allRows.length);
  });

  /* Audio events */
  audio.addEventListener('play', () => {
    clearStatus();
    ppIcon.setAttribute('href', '#icon-pause');
    setPlayingRow(currentIdx);
    const btn = allRows[currentIdx]?.querySelector('.ar-play-btn use');
    if (btn) btn.setAttribute('href', '#icon-pause');
  });
  audio.addEventListener('pause', () => {
    ppIcon.setAttribute('href', '#icon-play');
    const btn = allRows[currentIdx]?.querySelector('.ar-play-btn use');
    if (btn) btn.setAttribute('href', '#icon-play');
  });
  audio.addEventListener('ended', () => {
    clearStatus();
    loadTrack((currentIdx + 1) % allRows.length);
  });
  audio.addEventListener('error', () => {
    showAudioError();
  });
  audio.addEventListener('stalled', () => {
    setStatus('loading', '⚠️ Connexion instable — nouvelle tentative dans 8s…');
    clearTimeout(stallRetryId);
    stallRetryId = setTimeout(() => {
      if (!audio.paused) {
        const src = audio.src;
        audio.load();
        audio.src = src;
        audio.play().catch(() => showAudioError());
      }
    }, 8000);
  });
  audio.addEventListener('canplay', () => {
    clearTimeout(stallRetryId);
    clearStatus();
  });
  audio.addEventListener('waiting', () => {
    setStatus('loading', 'Mise en mémoire tampon…');
  });
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    pbBarFill.style.width = pct + '%';
    pbCurrent.textContent = fmt(audio.currentTime);
    pbDuration.textContent = fmt(audio.duration);
    setRowDuration(allRows[currentIdx], audio.duration);
  });
  audio.addEventListener('loadedmetadata', () => {
    pbDuration.textContent = fmt(audio.duration);
    setRowDuration(allRows[currentIdx], audio.duration);
  });

  /* Seek */
  pbBarWrap.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = pbBarWrap.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  /* Volume */
  volSlider.addEventListener('input', () => { audio.volume = volSlider.value; });
  btnMute.addEventListener('click', () => {
    audio.muted = !audio.muted;
    volSlider.value = audio.muted ? 0 : audio.volume;
  });

  /* Close player */
  btnClose.addEventListener('click', () => {
    clearTimeout(stallRetryId);
    clearStatus();
    audio.pause(); audio.src = '';
    playerBar.classList.remove('visible');
    allRows.forEach(r => {
      r.classList.remove('playing');
      const btn = r.querySelector('.ar-play-btn use');
      if (btn) btn.setAttribute('href', '#icon-play');
    });
    currentIdx = -1;
  });

  /* ── Renderer : construit les sections depuis les données JSON ── */
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderAudioSections(tracks) {
    /* Grouper par sectionName en conservant l'ordre d'apparition */
    const order = [];
    const groups = {};
    for (const t of tracks) {
      if (!groups[t.sectionName]) { groups[t.sectionName] = []; order.push(t.sectionName); }
      groups[t.sectionName].push(t);
    }
    const container = document.getElementById('audio-sections-container');
    container.innerHTML = order.map(name => {
      const rows = groups[name];
      const count = rows.length;
      return `<section class="audio-section">
        <div class="audio-section-hd">
          <div class="audio-hd-icon"><svg width="14" height="14"><use href="#icon-headphones"/></svg></div>
          <span class="audio-hd-name">${escapeHtml(name)}</span>
          <span class="audio-hd-count">${count} ${count > 1 ? 'parties' : 'partie'}</span>
        </div>
        <div class="audio-list">
          ${rows.map((t, i) => `
          <div class="audio-row"
               data-src="${escapeHtml(t.src)}"
               data-title="${escapeHtml(t.title)}"
               data-series="${escapeHtml(t.series)}">
            <button class="ar-play-btn" aria-label="Lire"><svg width="14" height="14"><use href="#icon-play"/></svg></button>
            <div><span class="ar-num">${String(i + 1).padStart(2, '0')}</span><span class="ar-playing-bars"><span></span><span></span><span></span><span></span></span></div>
            <div class="ar-info"><div class="ar-title">${escapeHtml(t.title)}</div><span class="ar-series">${escapeHtml(t.series)}</span></div>
            <span class="ar-dur">—</span>
            <a href="${escapeHtml(t.src)}" target="_blank" rel="noopener noreferrer" class="ar-dl" aria-label="Télécharger"><svg width="15" height="15"><use href="#icon-download"/></svg></a>
          </div>`).join('')}
        </div>
      </section>`;
    }).join('');
  }

  /* ── Init : chargement depuis JSON ── */
  fetch('assets/data/audios.json')
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(tracks) {
      renderAudioSections(tracks);
      buildPlaylist();
      initRows();
      preloadDurations();
    })
    .catch(function(e) {
      document.getElementById('audio-sections-container').innerHTML =
        '<p style="padding:2rem;color:rgba(255,255,255,.5)">Impossible de charger les audios. Veuillez réessayer.</p>';
      console.error('audios.json load error:', e);
    });

})();
</script>
</body>
</html>
