    <path d="M11.99 2C6.47 2 1.99 6.48 1.99 12c0 1.78.47 3.44 1.28 4.89L1.5 22l5.26-1.74C8.19 21.4 10.04 22 12 22c5.52 0 10-4.48 10-10S17.51 2 11.99 2zm.01 18c-1.72 0-3.34-.47-4.74-1.28l-.34-.2-3.12 1.03 1.05-3.04-.22-.37C3.47 14.97 3 13.55 3 12c0-4.97 4.03-9 9-9s9 4.03 9 9-4.03 9-9 9z"/>
