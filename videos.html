<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidéos | L'Évangile du Royaume</title>
  <meta name="description" content="Tous les messages vidéo de L'Évangile du Royaume — séries bibliques et enseignements disponibles sur YouTube.">
  <link rel="canonical" href="https://levangileduroyaume.com/videos.html">
  <meta property="og:url" content="https://levangileduroyaume.com/videos.html">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" href="assets/images/favicon.png" sizes="32x32">
  <link rel="stylesheet" href="assets/css/style.css?v=nav-labels-1">
  <link rel="stylesheet" href="assets/css/pages/videos.css">
  <meta property="og:image" content="https://levangileduroyaume.com/assets/images/og-default.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Vidéos",
    "url": "https://levangileduroyaume.com/videos.html",
    "description": "Tous les messages vidéo de L'Évangile du Royaume — séries bibliques et enseignements disponibles sur YouTube.",
    "inLanguage": "fr",
    "isPartOf": {
      "@type": "WebSite",
      "name": "L'Évangile du Royaume",
      "url": "https://levangileduroyaume.com/"
    }
  }
  </script>
</head>
<body data-page="videos">
<script src="assets/js/nav.js"></script>

<!-- ══ HEADER ═══════════════════════════════════════════════ -->
<!-- ══ HERO ═══════════════════════════════════════════════ -->
<div class="media-hero">
  <div class="container">
    <div class="media-hero-inner">
      <div>
        <p class="media-hero-eyebrow">Médias · L'Évangile du Royaume</p>
        <h1 class="media-hero-title">Vidéos</h1>
        <p class="media-hero-sub">Toutes les séries et messages disponibles sur YouTube — cliquez pour regarder.</p>
      </div>
      <a href="https://www.youtube.com/channel/UCycAoa7k7LqyvG_TQWlG5_g/live"
         target="_blank" rel="noopener noreferrer" class="yt-live-pill">
        <span class="yt-live-dot"></span>
        <svg width="16" height="16" aria-hidden="true"><use href="#icon-youtube"/></svg>
        Rejoindre le Live
      </a>
    </div>
  </div>

  <!-- Type tabs -->
  <div class="type-tabs" role="navigation" aria-label="Type de contenu">
    <div class="container">
      <div class="type-tabs-inner">
        <a href="videos.html" class="type-tab active">
          <svg width="15" height="15" aria-hidden="true"><use href="#icon-film"/></svg>
          Vidéos
        </a>
      </div>
    </div>
  </div>
</div>

<!-- ══ MAIN ═══════════════════════════════════════════════ -->
<main class="media-body" id="main-content">
  <div class="container">

    <!-- Barre de recherche vidéos -->
    <div class="vr-search-bar">
      <label for="video-search" class="sr-only">Rechercher une vidéo</label>
      <input type="search" id="video-search" class="vr-search-input"
             placeholder="Rechercher une vidéo ou une série…"
             autocomplete="off" spellcheck="false">
      <span id="video-count" class="vr-count" aria-live="polite" style="display:none"></span>
    </div>

    <div id="video-sections-container" aria-live="polite" aria-label="Séries vidéo">
      <!-- Chargé dynamiquement depuis assets/data/videos.json -->
    </div>

    <!-- YouTube CTA -->
    <div class="yt-cta">
      <div class="yt-cta-left">
        <div class="yt-cta-icon" aria-hidden="true"><svg width="22" height="22"><use href="#icon-youtube"/></svg></div>
        <div>
          <strong>S'abonner à la chaîne YouTube</strong>
          <span>11 800+ abonnés · Nouveaux messages chaque semaine</span>
        </div>
      </div>
      <a href="https://www.youtube.com/channel/UCycAoa7k7LqyvG_TQWlG5_g" target="_blank" rel="noopener noreferrer" class="btn-yt">
        <svg width="15" height="15" aria-hidden="true"><use href="#icon-youtube"/></svg>
        S'abonner
      </a>
    </div>

  </div>
</main>

<script src="assets/js/utils.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/video-renderer.js"></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
