<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidéos | L'Évangile du Royaume</title>
  <meta name="description" content="Tous les messages vidéo de L'Évangile du Royaume — séries bibliques et enseignements disponibles sur YouTube.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" href="assets/images/favicon.png" sizes="32x32">
  <link rel="stylesheet" href="assets/css/style.css?v=nav-labels-1">
  <style>

    /* ══════════════════════════════════════════════════════
       PAGE MÉDIAS — styles communs
    ══════════════════════════════════════════════════════ */

    .media-hero {
      background: linear-gradient(160deg, var(--brand-blue-dk) 0%, #162854 55%, var(--brand-blue) 100%);
      padding: 7rem 0 3rem;
    }
    .media-hero-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .media-hero-eyebrow {
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: .6rem;
    }
    .media-hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      margin-bottom: .65rem;
    }
    .media-hero-sub {
      font-size: .93rem;
      color: rgba(255,255,255,.55);
      max-width: 400px;
      line-height: 1.6;
    }

    /* ── Type tabs (Vidéos / Messages audio / Séries podcast) ─── */
    .type-tabs {
      background: rgba(0,0,0,.25);
      border-top: 1px solid rgba(255,255,255,.1);
    }
    .type-tabs-inner {
      display: flex;
      gap: 0;
    }
    .type-tab {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .95rem 1.5rem;
      font-size: .83rem;
      font-weight: 700;
      color: rgba(255,255,255,.5);
      text-decoration: none;
      border-bottom: 3px solid transparent;
      transition: color .2s, border-color .2s;
      white-space: nowrap;
    }
    .type-tab:hover { color: rgba(255,255,255,.85); }
    .type-tab.active { color: #fff; border-bottom-color: var(--gold-light); }
    .type-tab svg { opacity: .7; }
    .type-tab.active svg { opacity: 1; }

    /* ── YouTube Live button ────────────────────────────── */
    .yt-live-pill {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: #FF0000;
      color: #fff;
      padding: .75rem 1.5rem;
      border-radius: 99px;
      font-size: .88rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(255,0,0,.4);
      transition: background .2s, transform .15s;
      flex-shrink: 0;
    }
    .yt-live-pill:hover { background: #cc0000; transform: scale(1.04); }
    .yt-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: live-pulse 1.5s ease-in-out infinite; }

    /* ── Page body ──────────────────────────────────────── */
    .media-body {
      background: var(--ivory);
      padding: 2.5rem 0 5rem;
    }

    /* ── Section head ───────────────────────────────────── */
    .vsec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.1rem;
      padding-top: 2.75rem;
    }
    .vsec-head:first-child { padding-top: 0; }
    .vsec-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--charcoal);
    }
    .vsec-count {
      font-size: .75rem;
      font-weight: 600;
      color: var(--warm-grey);
      background: var(--ivory-dark);
      padding: .2rem .65rem;
      border-radius: 99px;
      margin-left: .65rem;
    }
    .vsec-link {
      font-size: .8rem;
      font-weight: 600;
      color: var(--brand-blue);
      text-decoration: none;
      opacity: .85;
      display: flex;
      align-items: center;
      gap: .3rem;
      transition: opacity .2s;
    }
    .vsec-link:hover { opacity: 1; }

    /* ══════════════════════════════════════════════════
       SERIES CARDS — accordion collapsible
    ══════════════════════════════════════════════════ */
    .series-list {
      display: flex;
      flex-direction: column;
      gap: .85rem;
      margin-bottom: .5rem;
    }

    .sc { /* series card */
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: 0 1px 8px rgba(0,0,0,.06);
      overflow: hidden;
    }

    .sc-header {
      display: grid;
      grid-template-columns: 160px 1fr auto;
      align-items: center;
      gap: 1.25rem;
      padding: .7rem 1.25rem .7rem .7rem;
      cursor: pointer;
      transition: background .2s;
    }
    .sc-header:hover { background: rgba(30,79,163,.03); }

    .sc-thumb {
      width: 160px;
      height: 90px;
      border-radius: 6px;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
      background: var(--ivory-dark);
    }

    .sc-badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .62rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #5e35b1;
      background: rgba(94,53,177,.08);
      border: 1px solid rgba(94,53,177,.15);
      padding: .18rem .55rem;
      border-radius: 99px;
      margin-bottom: .4rem;
    }
    .sc-title {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--charcoal);
      line-height: 1.25;
      margin-bottom: .3rem;
    }
    .sc-meta {
      font-size: .75rem;
      color: var(--warm-grey);
      display: flex;
      align-items: center;
      gap: .65rem;
    }

    .sc-toggle {
      display: flex;
      align-items: center;
      gap: .45rem;
      padding: .5rem 1rem;
      border-radius: 99px;
      background: rgba(30,79,163,.07);
      border: 1px solid rgba(30,79,163,.15);
      color: var(--brand-blue);
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
      flex-shrink: 0;
    }
    .sc-toggle:hover { background: rgba(30,79,163,.12); }
    .sc.open .sc-toggle { background: var(--brand-blue); color: #fff; border-color: var(--brand-blue); }
    .sc-chevron { width: 15px; height: 15px; transition: transform .3s; }
    .sc.open .sc-chevron { transform: rotate(180deg); }

    /* Episodes panel */
    .sc-episodes {
      max-height: 0;
      overflow: hidden;
      transition: max-height .4s cubic-bezier(.4,0,.2,1);
    }
    .sc.open .sc-episodes { max-height: 1600px; }

    .ep-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: .85rem;
      padding: 1rem 1rem 1.1rem;
      border-top: 1px solid var(--ivory-dark);
      background: var(--ivory);
    }

    .ep {
      text-decoration: none;
      color: inherit;
      background: var(--white);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
    }
    .ep:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.1); }

    .ep-img-wrap {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #1a1a2e;
    }
    .ep-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
    .ep:hover .ep-img-wrap img { transform: scale(1.06); }
    .ep-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.25);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s;
    }
    .ep:hover .ep-overlay { opacity: 1; }
    .ep-play-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      display: flex; align-items: center; justify-content: center;
    }
    .ep-dur {
      position: absolute; bottom: .4rem; right: .4rem;
      background: rgba(0,0,0,.78); color: #fff;
      font-size: .6rem; font-weight: 700;
      padding: .12rem .38rem; border-radius: .18rem;
    }
    .ep-num {
      font-size: .6rem; font-weight: 800;
      letter-spacing: .09em; text-transform: uppercase;
      color: #5e35b1; padding: .45rem .65rem .1rem;
    }
    .ep-title {
      font-size: .82rem; font-weight: 700;
      color: var(--charcoal); line-height: 1.3;
      padding: 0 .65rem .65rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ══════════════════════════════════════════════════
       STANDALONE VIDEO CARDS
    ══════════════════════════════════════════════════ */
    .vgrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }
    .vc {
      background: var(--white);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 1px 8px rgba(0,0,0,.06);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform .25s, box-shadow .25s;
    }
    .vc:hover { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(0,0,0,.11); }
    .vc-img {
      position: relative; aspect-ratio: 16/9; overflow: hidden; background: #111;
    }
    .vc-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
    .vc:hover .vc-img img { transform: scale(1.06); }
    .vc-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.2);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .25s;
    }
    .vc:hover .vc-overlay { opacity: 1; }
    .vc-play {
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(255,255,255,.92);
      display: flex; align-items: center; justify-content: center;
    }
    .vc-play svg { color: var(--brand-blue); }
    .vc-dur {
      position: absolute; bottom: .55rem; right: .55rem;
      background: rgba(0,0,0,.76); color: #fff;
      font-size: .63rem; font-weight: 700;
      padding: .16rem .44rem; border-radius: .18rem;
    }
    .vc-body { padding: .85rem .95rem 1rem; flex: 1; display: flex; flex-direction: column; gap: .3rem; }
    .vc-title { font-family: var(--font-serif); font-size: .95rem; font-weight: 700; color: var(--charcoal); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .vc-meta { font-size: .7rem; color: var(--warm-grey); margin-top: auto; }

    /* ── Series sections ────────────────────────────── */
    .series-section { margin-bottom: 2.75rem; }
    .series-hd {
      display: flex; align-items: center; gap: .75rem;
      margin-bottom: 1rem;
      padding-bottom: .65rem;
      border-bottom: 2px solid var(--ivory-dark);
    }
    .series-hd-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--brand-blue);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #fff;
    }
    .series-hd-name {
      font-family: var(--font-serif);
      font-size: 1.05rem; font-weight: 700; color: var(--charcoal);
    }
    .series-hd-count {
      font-size: .7rem; font-weight: 700; color: var(--warm-grey);
      background: var(--ivory-dark); padding: .18rem .55rem;
      border-radius: 99px; flex-shrink: 0;
    }
    .series-hd-link {
      margin-left: auto; font-size: .78rem; font-weight: 600;
      color: var(--brand-blue); text-decoration: none;
      display: flex; align-items: center; gap: .3rem; opacity: .8;
      white-space: nowrap;
    }
    .series-hd-link:hover { opacity: 1; }
    .series-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: .85rem;
    }

    /* ── YouTube CTA ─────────────────────────────────── */
    .yt-cta {
      margin-top: 3rem;
      background: linear-gradient(135deg, #0d0d0d 0%, #1c1c1c 100%);
      border-radius: var(--radius-lg);
      padding: 2rem 1.75rem;
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 1.5rem; flex-wrap: wrap;
    }
    .yt-cta-left { display: flex; align-items: center; gap: 1rem; }
    .yt-cta-icon {
      width: 48px; height: 48px; border-radius: 50%;
      background: #FF0000;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .yt-cta strong { display: block; font-family: var(--font-serif); font-size: 1.1rem; color: #fff; margin-bottom: .2rem; }
    .yt-cta span { font-size: .78rem; color: rgba(255,255,255,.45); }
    .btn-yt {
      display: inline-flex; align-items: center; gap: .5rem;
      background: #FF0000; color: #fff;
      padding: .75rem 1.5rem; border-radius: 99px;
      font-size: .86rem; font-weight: 700; text-decoration: none;
      transition: background .2s, transform .15s;
      white-space: nowrap;
    }
    .btn-yt:hover { background: #cc0000; transform: scale(1.04); }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 1200px) {
      .vgrid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 960px) {
      .vgrid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .vgrid { grid-template-columns: 1fr; }
      .media-hero-inner { flex-direction: column; align-items: flex-start; }
      .yt-live-pill { align-self: flex-start; }
      .yt-cta { flex-direction: column; align-items: flex-start; }
    }
  </style>
  <meta property="og:image" content="https://images.unsplash.com/photo-1529655683826-aba9b3e77383?w=1200&q=80&auto=format&fit=crop">
</head>
<body data-page="videos">
<script src="assets/js/nav.js"></script>

<!-- ══ HEADER ═══════════════════════════════════════════════ -->
<!-- ══ HERO ═══════════════════════════════════════════════ -->
<div class="media-hero">
  <div class="container">
    <div class="media-hero-inner">
      <div>
        <p class="media-hero-eyebrow">Médias · L'Évangile du Royaume</p>
        <h1 class="media-hero-title">Vidéos</h1>
        <p class="media-hero-sub">Toutes les séries et messages disponibles sur YouTube — cliquez pour regarder.</p>
      </div>
      <a href="https://www.youtube.com/channel/UCycAoa7k7LqyvG_TQWlG5_g/live"
         target="_blank" rel="noopener" class="yt-live-pill">
        <span class="yt-live-dot"></span>
        <svg width="16" height="16" aria-hidden="true"><use href="#icon-youtube"/></svg>
        Rejoindre le Live
      </a>
    </div>
  </div>

  <!-- Type tabs -->
  <div class="type-tabs" role="navigation" aria-label="Type de contenu">
    <div class="container">
      <div class="type-tabs-inner">
        <a href="videos.html" class="type-tab active">
          <svg width="15" height="15" aria-hidden="true"><use href="#icon-film"/></svg>
          Vidéos
        </a>
      </div>
    </div>
  </div>
</div>

<!-- ══ MAIN ═══════════════════════════════════════════════ -->
<main class="media-body" id="main-content">
  <div class="container">

    <div id="video-sections-container" aria-live="polite" aria-label="Séries vidéo">
      <!-- Chargé dynamiquement depuis assets/data/videos.json -->
    </div>

    <!-- YouTube CTA -->
    <div class="yt-cta">
      <div class="yt-cta-left">
        <div class="yt-cta-icon" aria-hidden="true"><svg width="22" height="22"><use href="#icon-youtube"/></svg></div>
        <div>
          <strong>S'abonner à la chaîne YouTube</strong>
          <span>11 800+ abonnés · Nouveaux messages chaque semaine</span>
        </div>
      </div>
      <a href="https://www.youtube.com/channel/UCycAoa7k7LqyvG_TQWlG5_g" target="_blank" rel="noopener" class="btn-yt">
        <svg width="15" height="15" aria-hidden="true"><use href="#icon-youtube"/></svg>
        S'abonner
      </a>
    </div>

  </div>
</main>

<style>
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  .nav-live-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:700;letter-spacing:.06em;color:#4CAF50;background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.25);padding:.35rem .85rem;border-radius:99px;text-decoration:none;transition:background .25s}
  .nav-live-badge:hover{background:rgba(76,175,80,.18)}
  .nav-link.active{color:#fff;font-weight:700}
</style>
<script>
(function () {
  'use strict';

  /* ── Sécurité XSS ─────────────────────────────────────── */
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  /* ── Rendu des sections vidéo ─────────────────────────── */
  function renderVideoSections(videos) {
    // Regrouper par série en conservant l'ordre d'apparition
    var order = [];
    var groups = {};
    for (var i = 0; i < videos.length; i++) {
      var v = videos[i];
      var s = v.series || 'Messages individuels';
      if (!groups[s]) {
        groups[s] = [];
        order.push(s);
      }
      groups[s].push(v);
    }

    var ytChannel = 'https://www.youtube.com/channel/UCycAoa7k7LqyvG_TQWlG5_g';

    var html = order.map(function (name) {
      var items = groups[name];
      var count = items.length;
      var isIndividual = (name === 'Messages individuels');

      var link = isIndividual ? '' :
        '<a href="' + ytChannel + '" target="_blank" rel="noopener noreferrer" class="series-hd-link">' +
        'YouTube <svg width="11" height="11"><use href="#icon-arrow-r"/></svg></a>';

      var cards = items.map(function (v) {
        var ytId   = escapeHtml(v.youtube_id);
        var title  = escapeHtml(v.title);
        var meta   = escapeHtml(v.meta || '');
        var thumb  = 'https://img.youtube.com/vi/' + ytId + '/mqdefault.jpg';
        var href   = 'https://youtu.be/' + ytId;
        return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" class="vc">' +
          '<div class="vc-img">' +
            '<img src="' + escapeHtml(thumb) + '" alt="" loading="lazy">' +
            '<div class="vc-overlay"><div class="vc-play">' +
              '<svg width="18" height="18"><use href="#icon-play"/></svg>' +
            '</div></div>' +
          '</div>' +
          '<div class="vc-body">' +
            '<div class="vc-title">' + title + '</div>' +
            '<div class="vc-meta">' + meta + '</div>' +
          '</div>' +
        '</a>';
      }).join('');

      return '<section class="series-section">' +
        '<div class="series-hd">' +
          '<div class="series-hd-icon"><svg width="14" height="14"><use href="#icon-film"/></svg></div>' +
          '<span class="series-hd-name">' + escapeHtml(name) + '</span>' +
          '<span class="series-hd-count">' + count + ' vidéo' + (count > 1 ? 's' : '') + '</span>' +
          link +
        '</div>' +
        '<div class="series-grid">' + cards + '</div>' +
      '</section>';
    }).join('');

    var container = document.getElementById('video-sections-container');
    container.innerHTML = html;
  }

  /* ── Chargement ───────────────────────────────────────── */
  fetch('assets/data/videos.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (videos) {
      renderVideoSections(videos);
    })
    .catch(function (e) {
      var container = document.getElementById('video-sections-container');
      container.innerHTML =
        '<p style="padding:2rem;text-align:center;color:var(--warm-grey)">' +
        'Impossible de charger les vidéos. Veuillez réessayer.' +
        '</p>';
      console.error('videos.json load error:', e);
    });
})();
</script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
