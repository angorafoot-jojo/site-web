name: Alerte déclencheur externe défaillant
description: >
  Ouvre une issue quand le filet de sécurité (cron GitHub natif) a dû remplacer
  le déclencheur externe cron-job.org. Mutualisé entre la rotation et le reset
  de minuit, qui dépendent tous deux du même service (CLAUDE.md §12).

inputs:
  github-token:
    description: Token pour créer l'issue
    required: true
  tache:
    description: Nom lisible de la tâche qui a dû être rattrapée (ex. « la rotation »)
    required: true
  heure-prevue:
    description: Heure UTC à laquelle le déclencheur externe aurait dû agir (ex. « 23h30 »)
    required: true
  consequence:
    description: Ce qui se dégrade si la panne se prolonge, en une phrase
    required: true

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // Label 'declencheur' volontairement ISOLÉ : aucun autre workflow ne
          // l'interroge, donc cette issue ne peut pas bâillonner les alertes
          // healthcheck / validation. Piège constaté du 20 au 26/07/2026 : #6
          // (radio,alerte) et #8 (radio,validation) laissées ouvertes ont rendu
          // la radio aveugle pendant 6 jours.
          const existing = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'declencheur',
          });
          if (existing.data.length > 0) {
            console.log('Alerte déclencheur déjà ouverte — pas de doublon créé.');
            return;
          }
          const jour = new Date().toISOString().slice(0, 10);
          const tache = ${{ toJSON(inputs.tache) }};
          const heure = ${{ toJSON(inputs['heure-prevue']) }};
          const consequence = ${{ toJSON(inputs.consequence) }};
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `⚠️ Déclencheur externe défaillant — ${tache} rattrapée par le secours (${jour})`,
            body: [
              `**${tache}** n'a pas été déclenchée à ${heure} UTC par cron-job.org.`,
              'Le filet de sécurité (cron GitHub natif) a pris le relais — mais avec du retard,',
              'les crons GitHub de ce dépôt arrivant avec +51 à +129 min de décalage.',
              '',
              '### Ce que ça veut dire',
              '',
              "L'antenne est sauvée pour cette nuit. Mais si cron-job.org reste muet,",
              `le secours rattrapera chaque nuit en retard : ${consequence}`,
              '',
              '### À vérifier',
              '',
              '1. Le dashboard cron-job.org : historique et statut des jobs radio.',
              '2. La validité du token utilisé pour `POST .../dispatches`.',
              '3. **Les deux jobs** (rotation 23h30 UTC et reset 00h00 UTC) — ils dépendent du même service, une panne les emporte ensemble.',
              '',
              `👉 [Log du run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '---',
              '',
              '**Fermer cette issue une fois cron-job.org rétabli** — tant qu\'elle est ouverte,',
              'les alertes `declencheur` suivantes sont supprimées (dédoublonnage).',
            ].join('\n'),
            labels: ['radio', 'declencheur'],
          });
