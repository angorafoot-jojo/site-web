name: TEST — Vérification playlists AzuraCast

on:
  workflow_dispatch:

jobs:
  check-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Lister toutes les playlists et détailler 000_TRANSITION
        env:
          AZURACAST_BASE_URL: https://parole-prophetique-fm.levangileduroyaume.com
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          curl -s \
            -H "Authorization: Bearer $AZURACAST_API_KEY" \
            -H "X-API-Key: $AZURACAST_API_KEY" \
            "$AZURACAST_BASE_URL/api/station/1/playlists" \
          | python3 -c "
          import json, sys


          def fmt_hhmm(v):
              # AzuraCast renvoie ces champs en ENTIER au format HHMM
              # (00h00 -> 0, 00h02 -> 2, 12h00 -> 1200). Les traiter comme
              # des chaines plantait le script (AttributeError), bug resté
              # invisible tant que le workflow ne démarrait pas.
              if v is None:
                  return '?'
              v = int(v)
              return f'{v // 100:02d}h{v % 100:02d}'

          raw = sys.stdin.read()
          try:
              playlists = json.loads(raw)
          except Exception as e:
              print('ERREUR JSON:', e)
              print('Réponse brute:', raw[:500])
              sys.exit(1)

          print(f'=== {len(playlists)} playlists trouvées ===')
          print()

          # Chercher 000_TRANSITION en priorité
          transition = next((p for p in playlists if '000_TRANSITION' in p.get('name', '')), None)

          if transition:
              print('=== PLAYLIST 000_TRANSITION — DÉTAIL COMPLET ===')
              print(json.dumps(transition, indent=2, ensure_ascii=False))
              print()
              # Analyse des risques de diffusion aléatoire
              ptype = transition.get('type', '?')
              include_in_automation = transition.get('include_in_automation', None)
              schedule = transition.get('schedule_items', [])
              is_enabled = transition.get('is_enabled', '?')
              print('--- ANALYSE ---')
              print(f'Type           : {ptype}')
              print(f'Activée        : {is_enabled}')
              print(f'Schedules      : {len(schedule)} créneau(x)')
              for s in schedule:
                  start_time = fmt_hhmm(s.get(\"start_time\"))
                  end_time   = fmt_hhmm(s.get(\"end_time\"))
                  days = s.get(\"days\", [])
                  print(f'  {start_time} → {end_time}  jours={days if days else \"tous\"}')
              # Ce qui planifie une playlist, c'est la présence de
              # schedule_items -- PAS le type. Vérifié le 10/09/2026 sur le
              # dump de 000_TRANSITION : type=default AVEC un créneau
              # 00h00-00h02, et elle diffuse correctement depuis des mois.
              # L'ancienne analyse criait au risque sur cette playlist saine.
              print()
              if schedule:
                  print(f'✅ {len(schedule)} créneau(x) défini(s) → joue UNIQUEMENT pendant ces créneaux')
              else:
                  print('ℹ️  Aucun créneau → rotation générale : ne joue que lorsque')
                  print('    aucune playlist planifiée ne fournit de titre (filet de secours).')
                  print('    Voulu pour 015_REMPLISSAGE, anormal pour une playlist de grille.')
          else:
              print('❌ Playlist 000_TRANSITION NON TROUVÉE')
              print()
              print('Playlists existantes :')
              for p in sorted(playlists, key=lambda x: x.get(\"name\", \"\")):
                  print(f'  [{p.get(\"id\")}] {p.get(\"name\")}  type={p.get(\"type\")}  enabled={p.get(\"is_enabled\")}')
          "
