name: TEST — Restart AutoDJ et vérification pointeur

on:
  workflow_dispatch:

jobs:
  test-restart:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostique API (réponse brute AVANT restart)
        env:
          AZURACAST_BASE_URL: https://parole-prophetique-fm.levangileduroyaume.com
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          echo "=== AVANT RESTART ($(date -u)) ==="
          echo "--- Test nowplaying public (sans auth) ---"
          RAW=$(curl -sv "$AZURACAST_BASE_URL/api/station/1/nowplaying" 2>&1)
          echo "$RAW" | head -60

          echo "--- Test nowplaying avec auth ---"
          RAW_AUTH=$(curl -sv \
            -H "Authorization: Bearer $AZURACAST_API_KEY" \
            -H "X-API-Key: $AZURACAST_API_KEY" \
            "$AZURACAST_BASE_URL/api/station/1/nowplaying" 2>&1)
          echo "$RAW_AUTH" | head -60

          echo "--- Parse JSON si valide ---"
          curl -s "$AZURACAST_BASE_URL/api/station/1/nowplaying" \
          | python3 -c "
          import json, sys
          raw = sys.stdin.read()
          print('Longueur réponse:', len(raw))
          if not raw.strip():
            print('RÉPONSE VIDE')
            sys.exit(0)
          try:
            d = json.loads(raw)
          except Exception as e:
            print('Erreur JSON:', e)
            print('Début réponse:', raw[:300])
            sys.exit(0)
          playing = d.get('now_playing', {})
          song = playing.get('song', {})
          print('Playlist :', playing.get('playlist', 'inconnue'))
          print('Titre    :', song.get('title', '?'))
          print('Elapsed  :', playing.get('elapsed', '?'), '/ Duration:', playing.get('duration', '?'))
          nxt = d.get('playing_next', {})
          if nxt:
            print('Suivant  :', nxt.get('song', {}).get('title', '?'))
          " || true

      - name: Restart AutoDJ + vider la file
        env:
          AZURACAST_BASE_URL: https://parole-prophetique-fm.levangileduroyaume.com
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          echo "=== RESTART ($(date -u)) ==="
          echo "--- Réponse restart ---"
          curl -sv -X POST \
            -H "Authorization: Bearer $AZURACAST_API_KEY" \
            -H "X-API-Key: $AZURACAST_API_KEY" \
            "$AZURACAST_BASE_URL/api/station/1/backend/restart" 2>&1 | tail -20
          echo ""
          sleep 8
          echo "--- Réponse queue/clear ---"
          curl -sv -X POST \
            -H "Authorization: Bearer $AZURACAST_API_KEY" \
            -H "X-API-Key: $AZURACAST_API_KEY" \
            "$AZURACAST_BASE_URL/api/station/1/queue/clear" 2>&1 | tail -20
          echo ""
          echo "Restart envoyé. Attente 35s..."

      - name: Attendre que Liquidsoap redémarre
        run: sleep 35

      - name: Lire ce qui joue APRÈS le restart
        env:
          AZURACAST_BASE_URL: https://parole-prophetique-fm.levangileduroyaume.com
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          echo "=== APRÈS RESTART ($(date -u)) ==="
          curl -s "$AZURACAST_BASE_URL/api/station/1/nowplaying" \
          | python3 -c "
          import json, sys
          raw = sys.stdin.read()
          print('Longueur réponse:', len(raw))
          if not raw.strip():
            print('RÉPONSE VIDE')
            sys.exit(0)
          try:
            d = json.loads(raw)
          except Exception as e:
            print('Erreur JSON:', e)
            print('Début réponse:', raw[:300])
            sys.exit(0)
          playing = d.get('now_playing', {})
          song = playing.get('song', {})
          print('Playlist :', playing.get('playlist', 'inconnue'))
          print('Titre    :', song.get('title', '?'))
          print('Elapsed  :', playing.get('elapsed', '?'), '/ Duration:', playing.get('duration', '?'))
          nxt = d.get('playing_next', {})
          if nxt:
            print('Suivant  :', nxt.get('song', {}).get('title', '?'))
          print()
          print('JINGLE = pointeur remis à 1 ✅')
          print('Bible/Musique = pointeur NON remis à 1 ❌')
          " || true
