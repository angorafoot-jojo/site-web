name: Garde de frontière de bloc

# ──────────────────────────────────────────────────────────────
# Supprime de la file AzuraCast les rediffusions immédiates qui
# apparaissent au démarrage d'un bloc (06h/12h/18h UTC) : la file se
# remplit parfois en double ([jingle, message] × 2) quand le bloc
# sortant s'est épuisé avant la frontière — le message du jour partait
# alors 2× d'affilée à l'antenne (observé les 09 et 11/07/2026).
#
# Minuit est déjà couvert par radio-midnight-reset.yml (même logique,
# via restart_autodj.py, qui a supprimé le doublon du 13/07 à 00h02).
#
# Le doublon attend en file pendant TOUTE la 1re lecture du message
# (10 à 25 min) : il faut intervenir dans ce délai.
#
# ⚠️ LE CRON GITHUB A ÉTÉ RETIRÉ LE 27/07/2026 — IL NE POUVAIT PAS MARCHER.
# L'hypothèse d'origine (« retard typique de 2 à 10 min, c'est suffisant »)
# était fausse. Mesure sur 18 runs consécutifs de ce workflow :
#
#     cron cible 06:00 → runs réels 07:49, 08:06, 08:07, 08:09, 08:06…
#     cron cible 12:00 → runs réels 12:56, 12:59, 13:14, 13:19, 13:22…
#     cron cible 18:00 → runs réels 18:51, 18:55, 18:57, 19:02, 19:10…
#
# soit +51 à +129 min de retard, JAMAIS moins de 51 min — donc toujours
# hors de la fenêtre utile de 10-25 min. Preuve par l'absence : aucun
# fichier logs/boundary_watch_*.log n'a jamais été créé, la garde n'a
# donc jamais retiré un seul doublon. Contre-preuve directe le 25/07 :
# doublons à 06:09:52 et 12:09:52 (message diffusé 6× pour 4 prévues),
# la garde est passée à 07:49 et 12:59 — bien après.
#
# ➜ Le workflow reste déclenchable À LA MAIN (workflow_dispatch), et
#   redevient utile dès qu'on lui ajoute des déclencheurs cron-job.org à
#   06h01/12h01/18h01 UTC (ponctuels à la minute, comme la rotation et le
#   reset de minuit). Contrairement à ces deux-là, une panne de
#   cron-job.org ne ferait ici que désactiver la garde, sans dégât en
#   cascade — le no-op est sans conséquence.
#
# ➜ La vraie cause reste à traiter (voir Radio/README.md §7, chantier
#   ouvert) : un micro-trou de 6 à 28 s juste AVANT la frontière précède
#   chacun des doublons mesurés — corrélation 4/4 sur 9 jours, et zéro
#   doublon les jours sans micro-trou.
#
# Aucune action sur l'antenne : lecture de la file + DELETE des
# doublons uniquement. Sans doublon, le run est un no-op silencieux.
# ──────────────────────────────────────────────────────────────
on:
  # Pas de 'schedule' : voir l'encadré ci-dessus (le cron GitHub arrive
  # systématiquement 51 à 129 min trop tard sur ce dépôt).
  workflow_dispatch:

permissions:
  contents: write   # committer le log de garde quand un doublon a été retiré
  issues: write     # alerter si la garde elle-même échoue

jobs:
  boundary-guard:
    name: Dédoublonnage de la file au démarrage du bloc
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Surveiller la file et retirer les doublons
        id: guard
        env:
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          python Radio/restart_autodj.py \
            --base-url https://parole-prophetique-fm.levangileduroyaume.com \
            --station-id 1 \
            --watch-only | tee guard-output.txt
          if grep -q "doublon dos à dos supprimé" guard-output.txt; then
            echo "dedup=true" >> $GITHUB_OUTPUT
          else
            echo "dedup=false" >> $GITHUB_OUTPUT
          fi

      - name: Committer le log de garde (seulement si un doublon a été retiré)
        if: steps.guard.outputs.dedup == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Radio/logs/boundary_watch_*.log
          git diff --staged --quiet || git commit -m "chore: garde de frontière — doublon retiré $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
          # Un autre workflow peut avoir poussé entre le checkout et ce push
          git push || (git pull --rebase origin main && git push)

      - name: Notifier en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'radio,alerte',
            });
            if (existing.data.length > 0) {
              console.log('Issue déjà ouverte — pas de doublon créé.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Garde de frontière échouée — ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`,
              body: `La garde de frontière de bloc (dédoublonnage de la file) a échoué.\n\nSans elle, si la file s'est remplie en double au démarrage du bloc, le message du jour peut partir 2× d'affilée à l'antenne.\n\n👉 [Voir le log complet](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['radio', 'alerte']
            })
