name: TEST — Exploration logs Liquidsoap AzuraCast

on:
  workflow_dispatch:

jobs:
  inspect-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Lister les logs disponibles puis extraire le liquidsoap.log
        env:
          AZURACAST_BASE_URL: https://parole-prophetique-fm.levangileduroyaume.com
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          echo "=== 1) Logs disponibles (GET /station/1/logs) ==="
          curl -s \
            -H "X-API-Key: $AZURACAST_API_KEY" \
            "$AZURACAST_BASE_URL/api/station/1/logs" \
          | tee /tmp/logs_list.json \
          | python3 -m json.tool

          echo
          echo "=== 2) Clé du log liquidsoap détectée ==="
          LOG_KEY=$(python3 -c "
import json
data = json.load(open('/tmp/logs_list.json'))
candidates = [l for l in data if 'liquidsoap' in (l.get('key','') + l.get('name','')).lower()]
print(candidates[0]['key'] if candidates else '')
")
          echo "LOG_KEY=$LOG_KEY"
          if [ -z "$LOG_KEY" ]; then
            echo "❌ Aucun log liquidsoap trouvé dans la liste ci-dessus — voir les clés disponibles."
            exit 0
          fi

          echo
          echo "=== 3) Contenu de $LOG_KEY (GET /station/1/log/$LOG_KEY) ==="
          curl -s \
            -H "X-API-Key: $AZURACAST_API_KEY" \
            "$AZURACAST_BASE_URL/api/station/1/log/$LOG_KEY" \
          > /tmp/liquidsoap_full.json

          python3 -c "
import json
data = json.load(open('/tmp/liquidsoap_full.json'))
# La réponse peut être {'contents': '...'} ou une liste de lignes selon la version.
if isinstance(data, dict) and 'contents' in data:
    text = data['contents']
elif isinstance(data, list):
    text = '\n'.join(str(x) for x in data)
else:
    text = json.dumps(data, indent=2, ensure_ascii=False)
print(f'--- Taille totale : {len(text)} caractères, {text.count(chr(10))} lignes ---')
lines = text.splitlines()
print('--- 5 premières lignes (début couvert par le log) ---')
for l in lines[:5]:
    print(l)
print('--- 5 dernières lignes (fin) ---')
for l in lines[-5:]:
    print(l)
open('/tmp/liquidsoap_full.txt', 'w').write(text)
"

          echo
          echo "=== 4) Lignes du 2026-07-12 (06h-12h UTC = BLOC_B, 5/9 jingles joués) ==="
          grep -E '2026/07/12 (0[6-9]|1[0-1]):' /tmp/liquidsoap_full.txt | head -100 || echo "(aucune ligne — le log ne remonte peut-être pas jusque-là, voir bornes ci-dessus)"

          echo
          echo "=== 5) Lignes contenant des mots-clés d'intérêt (skip/error/reject/short/queue) sur tout le log récupéré ==="
          grep -Ei 'skip|error|reject|too short|queue|underrun|fail' /tmp/liquidsoap_full.txt | head -100 || echo "(aucune correspondance)"
