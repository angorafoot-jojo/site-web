name: CI — Validation & Déploiement

# ──────────────────────────────────────────────────────────────
# Se déclenche sur chaque push vers main ET sur les pull requests.
#
# Deux validations indépendantes tournent en parallèle :
#   · « Validation du site »  → JSON, fichiers locaux, liens internes
#   · « Tests radio (Python) » → la suite pytest de Radio/
# Le déploiement GitHub Pages n'a lieu que si la validation DU SITE passe
# (voir JOB 3 pour la raison de ce découplage).
#
# ⚠️  PRÉREQUIS — à faire une seule fois dans GitHub Settings :
#     Settings → Pages → Source → "GitHub Actions"
#     Sans ce changement, GitHub Pages déploie depuis la branche main
#     indépendamment de ce workflow.
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, dev]     # CI s'exécute sur main ET dev
  pull_request:
    branches: [main]          # Valide chaque PR avant merge dans main
  workflow_dispatch:          # Lancement manuel depuis l'onglet Actions

# Permissions minimales nécessaires
permissions:
  contents: read
  pages: write
  id-token: write

# Empêcher deux déploiements simultanés
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  # ────────────────────────────────────────────────────────────
  # JOB 1 : Validation (bloque le déploiement si elle échoue)
  # ────────────────────────────────────────────────────────────
  validate:
    name: Validation du site
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Étape 1 : Validation des JSON + EPUB locaux ─────────
      - name: Validation JSON et fichiers locaux
        run: node scripts/validate-data.mjs --quick
        # --quick : vérifie JSON, champs requis, IDs uniques, EPUB locaux
        # Sans --quick : ajoute des HEAD requests sur tous les MP3/PDF distants
        # (trop lent pour la CI — environ 65 requêtes Backblaze)

      # ── Étape 2 : Validation des liens internes HTML ────────
      - name: Validation des liens internes
        run: node scripts/validate-links.mjs

  # ────────────────────────────────────────────────────────────
  # JOB 2 : Tests de l'automatisation radio (Python)
  #
  # Pourquoi un job séparé plutôt qu'une étape de « Validation du site » :
  # il produit un check au nom distinct dans la PR. « Tests radio (Python) »
  # en rouge dit immédiatement où chercher, au lieu de noyer l'échec dans
  # un check qui parle de JSON et de liens.
  #
  # Pourquoi le déploiement ne dépend PAS de ce job : les scripts de Radio/
  # ne sont pas servis par le site, ils tournent dans leurs propres
  # workflows (radio-*.yml). Bloquer la publication d'un livre ou d'un
  # article parce qu'un test de jingle échoue couplerait deux choses
  # indépendantes sans rien réparer. Le check reste visible — et rouge —
  # sur la PR, ce qui est précisément le but.
  #
  # Python 3.11 : exactement la version des workflows radio. Les tests
  # doivent tourner sur la version qui exécute le code en production, et
  # non sur celle du poste de développement, qui peut être plus récente.
  # ────────────────────────────────────────────────────────────
  test-radio:
    name: Tests radio (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances de test
        run: pip install -r Radio/requirements-dev.txt

      # Exactement la commande documentée pour le développement local,
      # afin qu'un vert en CI et un vert en local veuillent dire la même chose.
      - name: Lancer la suite de tests
        run: python -m pytest Radio/ -q

  # ────────────────────────────────────────────────────────────
  # JOB 3 : Déploiement (uniquement sur push vers main, après validation)
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Déploiement GitHub Pages
    needs: validate                  # bloqué si validate échoue
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Génération des pages individuelles ─────────────────────
      - name: Générer les pages individuelles (livres, audios, articles, vidéos, podcasts)
        run: node scripts/generate-pages.mjs

      # ── Génération du flux RSS podcasts ──────────────────────
      - name: Générer le flux RSS podcasts
        run: node scripts/generate-rss.mjs

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Uploader le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # racine du repo + pages générées

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
