name: Validation Chemins Radio

# ──────────────────────────────────────────────────────────────
# Vérifie chaque jour à 12h UTC que tous les fichiers référencés
# dans la config de rotation existent encore dans la médiathèque
# AzuraCast. Alerte par Issue 11h avant la rotation de 23h UTC,
# le temps de corriger un renommage ou un fichier supprimé.
# ──────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: Vérifier les chemins de la config
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Valider les chemins
        id: validate
        env:
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          python Radio/validate_paths.py \
            --config Radio/azuracast_rotation_config_option_a.example.json \
            | tee validation.log
          exit ${PIPESTATUS[0]}

      - name: Créer une alerte si des chemins sont introuvables
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let details = '';
            try { details = fs.readFileSync('validation.log', 'utf8'); } catch {}

            // Pas de doublon si une issue de validation est déjà ouverte
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'radio,validation',
            });
            if (existing.data.length > 0) {
              console.log('Issue déjà ouverte — pas de doublon créé.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Chemins radio invalides — ${new Date().toISOString().slice(0,10)}`,
              body: [
                '## Des fichiers de la config de rotation sont introuvables sur AzuraCast',
                '',
                'La rotation de **23h UTC ce soir échouera** si rien n\'est corrigé.',
                'Cause probable : fichier renommé, déplacé ou supprimé dans la médiathèque.',
                '',
                '```',
                details.trim(),
                '```',
                '',
                '### Comment corriger',
                '- Soit restaurer/renommer le fichier dans AzuraCast (Médias)',
                '- Soit corriger le `path` dans `Radio/azuracast_rotation_config_option_a.example.json`',
                '',
                `> [Voir le log complet](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
              labels: ['radio', 'validation'],
            });
            console.log('Issue d\'alerte créée.');
