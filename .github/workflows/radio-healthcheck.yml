name: Healthcheck Radio

# ──────────────────────────────────────────────────────────────
# Vérifie toutes les 15 minutes que le flux radio AzuraCast répond.
# En cas d'échec : crée automatiquement une Issue GitHub.
#
# Variables à configurer (Settings → Secrets and variables → Variables) :
#   RADIO_STREAM_URL  — ex: https://parole-prophetique-fm.levangileduroyaume.com/radio.mp3
#
# Si la variable n'est pas définie, le workflow affiche un avertissement et se termine sans erreur.
# ──────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '*/15 * * * *'   # toutes les 15 minutes
  workflow_dispatch:           # lancement manuel pour tester

permissions:
  contents: read
  issues: write                # nécessaire pour créer une Issue en cas d'alerte

jobs:
  healthcheck:
    name: Vérification flux radio
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier la variable RADIO_STREAM_URL
        id: check_var
        run: |
          if [ -z "${{ vars.RADIO_STREAM_URL }}" ]; then
            echo "⚠️  Variable RADIO_STREAM_URL non définie — healthcheck ignoré."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "url=${{ vars.RADIO_STREAM_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Tester le flux radio (HEAD request)
        id: probe
        if: steps.check_var.outputs.skip == 'false'
        run: |
          URL="${{ vars.RADIO_STREAM_URL }}"
          echo "Test du flux : $URL"
          # `|| true` + repli « 000 » : quand curl échoue (timeout, DNS,
          # serveur injoignable), HTTP_CODE restait VIDE, le test
          # `[ "" -ge 200 ]` plantait, l'étape passait en `failure` et l'étape
          # d'alerte — conditionnée à `ok == 'false'` — était SAUTÉE. Le
          # healthcheck n'alertait donc que si le serveur répondait une erreur
          # HTTP, c'est-à-dire seulement quand il était debout : la panne la
          # plus grave était la seule invisible. Constaté sur le run
          # 32047601458 du 17/08/2026 (étape de test en échec, alerte
          # `skipped`, aucune issue créée). Voir AUDIT_2026-11-17.md §3.3.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --head "$URL" || true)
          [ -z "$HTTP_CODE" ] && HTTP_CODE=000
          echo "Code HTTP : $HTTP_CODE"
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "✅ Le flux radio répond correctement (HTTP $HTTP_CODE)"
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Le flux radio ne répond pas (HTTP $HTTP_CODE)"
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Créer une alerte si la radio est hors ligne
        # `!cancelled()` et `!= 'true'` (et non `== 'false'`) : l'alerte part
        # aussi quand l'étape de test a elle-même échoué, donc sans écrire sa
        # sortie `ok`. Un workflow qui plante doit alerter, pas se taire.
        if: ${{ !cancelled() && steps.check_var.outputs.skip == 'false' && steps.probe.outputs.ok != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url   = '${{ vars.RADIO_STREAM_URL }}';
            const code  = '${{ steps.probe.outputs.http_code }}'
                        || 'aucune réponse — le test lui-même a échoué (serveur injoignable)';
            const now   = new Date().toISOString().slice(0, 16).replace('T', ' ');

            // Vérifier si une issue ouverte pour ce problème existe déjà
            // Dédoublonnage par SUJET (3e label), pas par `radio,alerte` :
            // une issue d'un autre sujet laissée ouverte ne doit plus rendre ce
            // workflow muet. L'issue #16 (playlist de secours, 10/09/2026) est
            // restée ouverte 68 jours et a bâillonné CINQ workflows — dont
            // « radio hors ligne ». 3e occurrence du piège (cf. #6 et #8 en
            // juillet). Voir AUDIT_2026-11-17.md §3.4.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'radio,alerte,flux',
            });

            if (existing.data.length > 0) {
              console.log('Issue déjà ouverte — pas de doublon créé.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Radio hors ligne — ${now} UTC`,
              body: [
                `## Le flux radio ne répond plus`,
                ``,
                `**URL testée :** \`${url}\``,
                `**Code HTTP reçu :** \`${code}\``,
                `**Détecté à :** ${now} UTC`,
                ``,
                `### Actions possibles`,
                `- Vérifier l'état d'AzuraCast : tableau de bord admin`,
                `- Vérifier les logs du serveur`,
                `- Redémarrer le service si nécessaire`,
                ``,
                `> Issue créée automatiquement par le workflow \`radio-healthcheck.yml\``,
                `> [Voir le log complet](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
              labels: ['radio', 'alerte', 'flux'],
            });
            console.log('Issue d\'alerte créée avec succès.');
