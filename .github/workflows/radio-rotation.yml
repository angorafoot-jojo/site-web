name: Rotation Radio Quotidienne

on:
  schedule:
    # 23h30 UTC : la rotation réécrit les 4 blocs AVANT l'ouverture du bloc A
    # à 00h00. Ainsi le bloc A démarre directement sur le message (comme B/C/D),
    # au lieu de dérouler Bible/musique pendant ~5h (le redémarrage AutoDJ ne
    # réinitialisait pas le bloc A déjà à l'antenne avec l'ancien cron 00h05).
    # 23h30 = 330 min dans le créneau D > RESTART_GRACE_MINUTES (30) → pas de
    # redémarrage AutoDJ → le bloc D en cours n'est PAS coupé. Créneau hors heure
    # pleine = moins de retard de file d'attente GitHub Actions qu'à 00h0x.
    - cron: '30 23 * * *'
  workflow_dispatch:        # Permet un lancement manuel depuis GitHub

jobs:
  rotation:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Nécessaire pour committer l'état
      issues: write         # Nécessaire pour créer une Issue en cas d'échec

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r Radio/requirements.txt

      - name: Lancer la rotation
        env:
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: |
          python Radio/azuracast_rotation_4_blocs.py \
            --config Radio/azuracast_rotation_config_option_a.example.json \
            --state Radio/azuracast_rotation_state.json

      - name: Sauvegarder l'état dans le repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Radio/azuracast_rotation_state.json
          git diff --staged --quiet || git commit -m "chore: rotation du $(date '+%Y-%m-%d') [skip ci]"
          # Un autre workflow peut avoir poussé entre le checkout et ce push
          git push || (git pull --rebase origin main && git push)

      - name: Notifier en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Rotation radio échouée — ${new Date().toISOString().slice(0,10)}`,
              body: `La rotation automatique du **${new Date().toISOString().slice(0,10)}** a échoué.\n\nLes blocs A/B/C/D n'ont pas été mis à jour. La radio diffuse les blocs de la veille.\n\n👉 [Voir le log complet](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['radio', 'urgent']
            })
